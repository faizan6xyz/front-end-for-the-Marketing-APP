<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Instagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ea;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #181b21;
    border: 1px solid #2a2e37;
    border-radius: 16px;
    padding: 32px 28px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p.sub { font-size: 14px; color: #9aa0ab; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: #9aa0ab; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 11px 12px;
    background: #0f1115;
    border: 1px solid #2a2e37;
    border-radius: 8px;
    color: inherit;
    font-size: 14px;
    margin-bottom: 18px;
  }
  input:focus { outline: none; border-color: #c13584; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
    transition: opacity .15s;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #msg { margin-top: 16px; font-size: 13px; min-height: 18px; }
  #msg.error { color: #ff6b6b; }
  #msg.ok { color: #6bd68a; }
</style>
</head>
<body>
  <div class="card">
    <h1>Connect Instagram</h1>
    <p class="sub">Authorize your Instagram account to continue.</p>

    <label for="token">Access token</label>
    <input id="token" type="text" placeholder="Paste your app token" autocomplete="off">

    <button id="btn">Connect Instagram</button>
    <div id="msg"></div>
  </div>

<script>
  const API_URL = "http://127.0.0.1:5000/instagram/auth/login";

  const tokenInput = document.getElementById("token");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  const params = new URLSearchParams(window.location.search);
  tokenInput.value = params.get("token") || localStorage.getItem("app_token") || "";
  function setMsg(text, type = "") {
    msg.textContent = text;
    msg.className = type;
  }
  btn.addEventListener("click", async () => {
    const token = tokenInput.value.trim();
    if (!token) return setMsg("Please enter a token.", "error");

    btn.disabled = true;
    setMsg("Contacting server...");

    try {
      localStorage.setItem("app_token", token);

      const res = await fetch(API_URL, {
        method: "POST",credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });

      const data = await res.json();
      console.log(data)
      if (data.status === "failed") {
        setMsg("Failed: " + (data.reason || "unknown error"), "error");
        btn.disabled = false;
        return;
      }
      if (data.auth_url) {
        setMsg("Redirecting to Instagram...", "ok");
        window.location.href = data.auth_url;
      } else {
        setMsg("No auth_url in response.", "error");
        btn.disabled = false;
      }
    } catch (err) {
      setMsg("Request failed: " + err.message, "error");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
