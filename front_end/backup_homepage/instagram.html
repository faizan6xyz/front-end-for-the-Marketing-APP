  <!-- Sidebar -->

    <div class="brand">
      <span class="brand-name">Leo Social</span>
    </div>

    <nav class="nav">
      <ul>
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><span class="nav-icon">▦</span> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="linkedln.html"><span class="nav-icon">🗂</span> Linkdeln</a></li>
        <li class="nav-item active"><a class="nav-link" href="instagram.html"><span class="nav-icon">🕒</span> Instagram</a></li>
        <li class="nav-item"><a class="nav-link" href="whatsapp.html"><span class="nav-icon">🔗</span> Whatsapp</a></li>
        <li class="nav-item"><a class="nav-link" href="gmail.html"><span class="nav-icon">👤</span> Gmail</a></li>
        <li class="nav-item"><a class="nav-link" href="create.html"><span class="nav-icon">🧾</span> Create</a></li>

      </ul>
    </nav>

  </aside>

  <!-- Main content -->
  <main class="main">
    <header class="topbar">
      <h1 id="page-title">Instagram</h1>
      <div class="topbar-right">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search...">
        </div>
        <button class="icon-btn" aria-label="Notifications">🔔</button>
        <div class="avatar"></div>
      </div>
    </header>

    <section class="page active" id="page-instagram">
      <section class="overview">
        <div class="overview-header">
          <div class="multi-select" id="rangeSelect">
          <div class="multi-select-trigger">
              <span class="multi-select-label">Select metrics</span>
              <span class="multi-select-arrow">▾</span>
          </div>
          <div class="multi-select-options">
             <label><input type="checkbox" value="media_id"> Media ID</label>
              <label><input type="checkbox" value="views"> Views</label>
              <label><input type="checkbox" value="likes"> Likes</label>
              <label><input type="checkbox" value="reach"> Reach</label>
              <label><input type="checkbox" value="replies"> Replies</label>
              <label><input type="checkbox" value="shares"> Shares</label>
              <label><input type="checkbox" value="navigation"> Navigation</label>
              <label><input type="checkbox" value="follows"> Follows</label>
              <label><input type="checkbox" value="profile_activity"> Profile Activity</label>
              <label><input type="checkbox" value="hour"> Hour</label>
              <label><input type="checkbox" value="story_is"> Story ID</label>
              <label><input type="checkbox" value="thumbnail"> Thumbnail</label>
              <label><input type="checkbox" value="time"> Time</label>
          </div>
          <div class="multi-select-options1">
            <label><input type="checkbox" value="media_id"> Media ID</label>
            <label><input type="checkbox" value="views"> Views</label>
            <label><input type="checkbox" value="likes"> Likes</label>
            <label><input type="checkbox" value="comments"> Comments</label>
            <label><input type="checkbox" value="saved"> Saved</label>
            <label><input type="checkbox" value="shares"> Shares</label>
            <label><input type="checkbox" value="total_interaction"> Total Interaction</label>
            <label><input type="checkbox" value="profile_activity"> Profile Activity</label>
            <label><input type="checkbox" value="time"> Time</label>
            <label><input type="checkbox" value="follows"> Follows</label>
            <label><input type="checkbox" value="thumbnail"> Thumbnail</label>
            <label><input type="checkbox" value="posted"> Posted</label>
          </div>
        </div>
        <select class="contentType" id="contentType" name="contentType">
          <option value="post" >Post</option>
          <option value="story" >Story</option>
        </select>
          <button  class="shiiii" >+ Post </button>
          <select class="multipe">
            <option value="30">Last 30 days</option>
            <option value="7">Last 7 days</option>
          </select>
        </div>
      </section>
      <div id="hello_insta" >
      <div class="insta-grid"></div>
      </div>
